name: setup-publish
description: Build and package to prepare for publishing.

runs:
  using: composite
  steps:
    - uses: './.github/actions/gh-config'
    - uses: actions/checkout@v4
    - uses: forcedotcom/salesforcedx-vscode/.github/actions/setup-pnpm@1f6324b6c547d6402c6d88d6b82dce36b16c3e24
      with:
        node-version: '24'
    - name: Build project
      run: pnpm build
      shell: bash
    - name: Pack Library
      run: pnpm pack
      shell: bash
