name: Tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  pnpm-lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: forcedotcom/salesforcedx-vscode/.github/actions/setup-pnpm@faea38a95d42dd464e254e10579eb910655e468d
        with:
          node-version: '24'
          install: 'false'
      - run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
  prevent-typescript-dependency:
    needs: pnpm-lockfile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: forcedotcom/salesforcedx-vscode/.github/actions/setup-pnpm@faea38a95d42dd464e254e10579eb910655e468d
        with:
          node-version: '24'
          install: 'false'
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Check for a production TypeScript dependency
        run: |
          dependencies=$(pnpm list --prod --depth Infinity --parseable)
          if grep -q '/node_modules/typescript$' <<< "$dependencies"; then
            echo 'ERROR: TypeScript production dependency found'
            pnpm why --prod typescript
            exit 1
          fi
  linux-unit-tests:
    needs: pnpm-lockfile-check
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsLinux.yml@main
    with:
      # The shared dependency check uses Yarn; the pnpm check runs above.
      skipTsDepCheck: true
      package-manager: pnpm
      package-manager-version: 12.8.2
      cache-dependency-path: pnpm-lock.yaml
      install-command: pnpm install --frozen-lockfile
      build-command: pnpm build
      test-command: pnpm test
      # This repository does not use wireit.
      wireit-install-command: 'true'
  windows-unit-tests:
    needs: pnpm-lockfile-check
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsWindows.yml@main
    with:
      package-manager: pnpm
      package-manager-version: 12.8.2
      cache-dependency-path: pnpm-lock.yaml
      install-command: pnpm install --frozen-lockfile
      build-command: pnpm build
      test-command: pnpm test
      wireit-install-command: 'true'
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: forcedotcom/salesforcedx-vscode/.github/actions/setup-pnpm@faea38a95d42dd464e254e10579eb910655e468d
        with:
          node-version: ${{ matrix.node-version }}
      - name: Lint
        run: pnpm lint
  test-bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: forcedotcom/salesforcedx-vscode/.github/actions/setup-pnpm@faea38a95d42dd464e254e10579eb910655e468d
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build the project
        run: pnpm build
      - name: check if bundling runs into failures
        run: node scripts/testEsbuild.js
  external-test:
    name: run tests in plugin-templates
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: forcedotcom/salesforcedx-vscode/.github/actions/setup-pnpm@faea38a95d42dd464e254e10579eb910655e468d
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build and pack templates
        run: |
          pnpm build
          pnpm pack --out templates.tgz
      - run: echo "$RUNNER_TEMP/sf-bin" >> "$GITHUB_PATH"
      - name: Install CLI
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: pnpm add --global @salesforce/cli@nightly
          timeout_minutes: 20
        env:
          PNPM_CONFIG_GLOBAL_BIN_DIR: ${{ runner.temp }}/sf-bin
      - name: Checkout to external project
        uses: actions/checkout@v4
        with:
          repository: 'salesforcecli/plugin-templates'
          path: plugin-templates
      - name: Swap dependency
        working-directory: plugin-templates
        run: |
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); pkg.dependencies["@salesforce/templates"] = "file:../templates.tgz"; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");'
          # Isolate this Yarn-based consumer from the parent pnpm workspace and
          # skip sf-install, which modifies its manifest and invokes Yarn hooks.
          printf 'nodeLinker: hoisted\nignoreScripts: true\n' > pnpm-workspace.yaml
          pnpm import
      - name: Install external project dependencies
        working-directory: plugin-templates
        run: pnpm install --frozen-lockfile
      - name: Build the external project (where the tests are)
        working-directory: plugin-templates
        run: pnpm build
      - name: Run tests
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: cd plugin-templates && pnpm test:nuts
          retry_on: error
