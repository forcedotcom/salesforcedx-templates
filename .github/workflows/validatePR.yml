name: PR Validation

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    # Main is the default/release branch; v67 work is isolated until the release hold clears.
    branches: [main, v67-modernization]

jobs:
  pr-validation:
    uses: salesforcecli/github-workflows/.github/workflows/validatePR.yml@main
